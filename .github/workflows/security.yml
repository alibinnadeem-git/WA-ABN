name: Security checks

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 12 * * 1"

permissions:
  contents: read

jobs:
  dependency-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Reject Dockerfile VOLUME on Railway
        run: |
          if grep -nE '^[[:space:]]*VOLUME([[:space:]]|$)' Dockerfile; then
            echo 'Do not declare Docker VOLUME; configure persistent storage through Railway or Compose mounts.' >&2
            exit 1
          fi
      - name: Validate vendor Compose syntax
        run: |
          echo DATA_DIR=/data > "$RUNNER_TEMP/filter-crm-test.env"
          VENDOR_IMAGE=filter-crm-ci:smoke VENDOR_ENV_FILE="$RUNNER_TEMP/filter-crm-test.env" docker compose -f deploy/vendor.compose.yml config --quiet
      - name: Build production container image
        run: docker build --file Dockerfile --tag podium-crm-ci:test .
      - run: npm audit --audit-level=high

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Avoid Docker Hub pull-rate limits on unauthenticated GitHub runners.
      - name: Install Semgrep in isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/python" -m pip install --disable-pip-version-check semgrep
      - name: Run Semgrep policy scan
        run: "$RUNNER_TEMP/semgrep-venv/bin/semgrep scan --config auto --error ."

  osv:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@c7c7bcb0773cc4678a674ada03a66cc5c4325476
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
